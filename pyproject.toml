[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wincheck"
version = "0.1.0"
description = "An agent that reproduces, fixes and verifies Windows-specific bugs in Python projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    # Pinned to the neatlogs commit that records tokens for messages.stream() helpers
    # (neatlogs/neatlogs#218). 1.4.27 on PyPI leaves them at 0. Go back to a version
    # range once a release includes it.
    "neatlogs @ git+https://github.com/neatlogs/neatlogs@03fd3c4f26b1e2fb2a126160e5cc5b97e35828e1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
wincheck = "wincheck.cli:main"
wincheck-mcp = "wincheck.mcp_server:main"

[tool.setuptools]
packages = ["wincheck"]

[tool.setuptools.package-data]
wincheck = ["issues/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
